aid: genesco
name: Genesco
description: >-
  Genesco is a specialty retailer and branded company selling footwear,
  apparel, and accessories through more than 1,400 retail stores and
  e-commerce sites under banners including Journeys, Schuh, Johnston & Murphy,
  and Genesco Brands. Genesco publishes no public API, developer portal, or
  OpenAPI document — it says so itself in the llms.txt it serves on
  journeys.com. What it does publish is an agent-access posture: an llms.txt
  for AI assistants, a Content-Signal AI-usage declaration in robots.txt on
  Journeys and Johnston & Murphy, a named allow list for AI search and
  user-requested agents, an llm= referral attribution convention, and
  server-rendered schema.org ProductGroup JSON-LD on every product page.
